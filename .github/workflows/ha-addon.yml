name: Home Assistant add-on image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check tag matches add-on version
        run: |
          version=$(sed -n 's/^version: //p' ha-addon/config.yml)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag/ref '$GITHUB_REF_NAME' does not match ha-addon/config.yml version '$version'"
            exit 1
          fi
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error::package.json version does not match ha-addon/config.yml version '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ha-addon/Dockerfile
          push: true
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ env.VERSION }}
          tags: ghcr.io/anderizquierdo/congatudo-addon-amd64:${{ env.VERSION }}
